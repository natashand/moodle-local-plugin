
services:
  mysql:
    image: mysql:8.0
    container_name: moodle_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodleuser
      MYSQL_PASSWORD: moodlepassword
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - moodle_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  moodle:
    image: bitnami/moodle:4.3
    container_name: moodle_app
    environment:
      MOODLE_DATABASE_TYPE: mysqli
      MOODLE_DATABASE_HOST: mysql
      MOODLE_DATABASE_PORT: 3306
      MOODLE_DATABASE_NAME: moodle
      MOODLE_DATABASE_USER: moodleuser
      MOODLE_DATABASE_PASSWORD: moodlepassword
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: adminpassword
      MOODLE_EMAIL: admin@example.com
      MOODLE_SITE_NAME: My Moodle Site
    ports:
      - "8082:8080"
      - "8443:8443"
    volumes:
      - moodle_data:/bitnami/moodle
      - moodledata_data:/bitnami/moodledata
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - moodle_network

volumes:
  mysql_data:
  moodle_data:
  moodledata_data:

networks:
  moodle_network:
    driver: bridge